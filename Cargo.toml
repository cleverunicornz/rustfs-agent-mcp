[package]
name = "rustfs-agent-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
base64 = "0.22"
rust-mcp-axum = "1"
rust-mcp-sdk = { version = "1.0.1", default-features = false, features = ["server", "macros", "streamable-http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
