name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: warp-ubuntu-2604-x64-2x
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          strip target/release/rustfs-agent-mcp
          tar -czf rustfs-agent-mcp-linux-amd64.tar.gz \
            -C target/release rustfs-agent-mcp
          sha256sum rustfs-agent-mcp-linux-amd64.tar.gz \
            > rustfs-agent-mcp-linux-amd64.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_PROMPT_DISABLED: 1
        run: |
          gh release create "$GITHUB_REF_NAME" \
            rustfs-agent-mcp-linux-amd64.tar.gz \
            rustfs-agent-mcp-linux-amd64.tar.gz.sha256 \
            --title "rustfs-agent-mcp $GITHUB_REF_NAME" \
            --generate-notes
